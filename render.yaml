services:
  - type: web
    name: velamia-admin-cms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        scope: run
      - key: SUPABASE_ANON_KEY
        scope: run
      - key: SUPABASE_SERVICE_KEY
        scope: run
      - key: JWT_SECRET
        scope: run
      - key: ADMIN_EMAIL
        scope: run
      - key: ADMIN_PASSWORD
        scope: run
